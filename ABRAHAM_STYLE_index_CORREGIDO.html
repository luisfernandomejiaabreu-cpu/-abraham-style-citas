const SUPABASE_URL = 'https://hllmiksoponfdwxzyubb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Er_gNx0sH8KjFJSkju8ncg_oeLyFLy4';
const slots=[]; let selected='';
for(let h=10;h<=22;h++) for(const m of [0,30]) { if(h===22&&m===30) continue; slots.push(String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')); }
function localDate(){ const d=new Date(); const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function fmt(t){ return new Date('2000-01-01T'+t).toLocaleTimeString('es-DO',{hour:'numeric',minute:'2-digit'}); }
async function getBooked(date){
  const url = SUPABASE_URL + '/rest/v1/appointment_slots?select=appointment_date,appointment_time&appointment_date=eq.' + encodeURIComponent(date);
  const r = await fetch(url,{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}});
  if(!r.ok) throw new Error('No se pudieron consultar los horarios.');
  return (await r.json()).map(x=>String(x.appointment_time).slice(0,5));
}
async function render(){
  const d=document.getElementById('date').value, box=document.getElementById('slots');
  box.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:18px;color:#777">Cargando horarios...</div>'; selected='';
  if(!d) return;
  try{
    const booked=await getBooked(d); const available=slots.filter(t=>!booked.includes(t)); box.innerHTML='';
    if(!available.length){box.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:18px;color:#777">No hay horarios disponibles para este día.</div>';return;}
    available.forEach(t=>{const x=document.createElement('button');x.className='slot';x.textContent=fmt(t);x.onclick=()=>{document.querySelectorAll('.slot').forEach(y=>y.classList.remove('selected'));x.classList.add('selected');selected=t};box.appendChild(x);});
  }catch(e){box.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:18px;color:#b00020">No se pudieron cargar los horarios. Intenta nuevamente.</div>';console.error(e);}
}
async function book(){
  const date=document.getElementById('date').value,name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim(),msg=document.getElementById('msg');
  if(!date||!selected||!name||!phone){alert('Completa el día, la hora, nombre y teléfono.');return;}
  const time=selected; selected='';
  try{
    const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/create_appointment',{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({p_date:date,p_time:time+':00',p_name:name,p_phone:phone})});
    if(r.status===409){msg.style.display='block';msg.textContent='Ese horario acaba de ser reservado por otra persona. Elige otro.';await render();return;}
    if(!r.ok){const detail=await r.text();console.error(detail);throw new Error('No se pudo guardar la cita.');}
    msg.style.display='block';msg.textContent='Cita confirmada: '+date+' a las '+fmt(time);document.getElementById('name').value='';document.getElementById('phone').value='';await render();
  }catch(e){msg.style.display='block';msg.textContent='No se pudo confirmar la cita. Intenta nuevamente.';console.error(e);await render();}
}
const dateInput=document.getElementById('date'); dateInput.value=localDate(); dateInput.min=localDate(); dateInput.addEventListener('change',render); render();
</script></body></html>
