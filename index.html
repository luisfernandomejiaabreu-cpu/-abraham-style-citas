le</div><label for="date">Selecciona el día</label><input id="date" type="date"><label>Selecciona la hora</label><div id="slots" class="slots"></div><label for="name">Nombre</label><input id="name" placeholder="Tu nombre"><label for="phone">Teléfono</label><input id="phone" type="tel" placeholder="Tu teléfono"><button class="confirm" onclick="book()">CONFIRMAR CITA</button><div id="msg" class="msg"></div><small>Citas cada 30 minutos · 10:00 AM a 10:00 PM</small></main><script>const key='abraham_style_bookings';let selected='';const slots=[];for(let h=10;h<=22;h++)for(let m of [0,30]){if(h===22&&m===30)continue;slots.push(String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'))}function bookings(){return JSON.parse(localStorage.getItem(key)||'[]')}function render(){const d=document.getElementById('date').value;const b=bookings().filter(x=>x.date===d).map(x=>x.time);const box=document.getElementById('slots');box.innerHTML='';selected='';const available=slots.filter(t=>!b.includes(t));if(!available.length){box.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:18px;color:#777">No hay horarios disponibles para este día.</div>';return}available.forEach(t=>{const x=document.createElement('button');x.className='slot';x.textContent=new Date('2000-01-01T'+t).toLocaleTimeString('es-DO',{hour:'numeric',minute:'2-digit'});x.onclick=()=>{document.querySelectorAll('.slot').forEach(y=>y.classList.remove('selected'));x.classList.add('selected');selected=t};box.appendChild(x)})}function book(){const date=document.getElementById('date').value,name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim();if(!date||!selected||!name||!phone)return alert('Completa el día, la hora, nombre y teléfono.');const arr=bookings();if(arr.some(x=>x.date===date&&x.time===selected))return render();arr.push({date,time:selected,name,phone});localStorage.setItem(key,JSON.stringify(arr));document.getElementById('msg').style.display='block';document.getElementById('msg').textContent='Cita confirmada: '+date+' a las '+new Date('2000-01-01T'+selected).toLocaleTimeString('es-DO',{hour:'numeric',minute:'2-digit'});selected='';render()}document.getElementById('date').value=new Date().toISOString().slice(0,10);document.getElementById('date').min=document.getElementById('date').value;document.getElementById('date').addEventListener('change',render);render();</script></body></html>
