body:after{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.10),rgba(0,0,0,.28) 55%,rgba(0,0,0,.48));z-index:0}
.page{position:relative;z-index:1;width:min(980px,100%);margin:auto;padding:24px 20px 60px}
.topbar{height:52px;display:flex;align-items:center;justify-content:space-between}
.menu,.social{height:46px;border:1px solid rgba(255,255,255,.22);background:rgba(0,0,0,.58);backdrop-filter:blur(10px);box-shadow:0 8px 25px rgba(0,0,0,.4)}
.menu{width:46px;border-radius:13px;display:grid;place-items:center;font-size:25px}
.social{display:flex;align-items:center;gap:13px;padding:0 13px;border-radius:13px;font-size:21px}
.hero{text-align:center}
.logo{display:block;width:min(380px,68vw);height:270px;object-fit:contain;margin:-4px auto -10px;filter:drop-shadow(0 0 16px rgba(255,0,40,.35)) drop-shadow(0 0 20px rgba(0,125,255,.32))}
h1{margin:0;font-size:clamp(42px,7vw,78px);line-height:.94;font-weight:1000;letter-spacing:-2.5px;text-transform:uppercase;text-shadow:0 5px 25px #000}
h1 .tu{color:var(--red)} h1 .cita{color:#0b94ff}
.brandline{margin:12px 0 7px;font-size:15px;letter-spacing:8px;font-weight:900}
.subtitle{font-size:17px;letter-spacing:.6px;margin-bottom:22px}
.benefits{display:grid;grid-template-columns:repeat(3,1fr);max-width:760px;margin:0 auto 26px}
.benefit{min-height:70px;display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 18px;border-right:1px solid rgba(255,255,255,.25);font-weight:800;line-height:1.25}
.benefit:last-child{border-right:0}
.bicon{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:2px solid #fff;font-size:21px;box-shadow:0 0 18px rgba(0,140,255,.45)}
.card{position:relative;max-width:790px;margin:auto;padding:28px 30px 30px;border-radius:27px;background:linear-gradient(145deg,rgba(3,8,14,.94),rgba(6,17,27,.84));box-shadow:0 25px 70px rgba(0,0,0,.72),inset 0 0 50px rgba(0,0,0,.2);overflow:hidden}
.card:before{content:"";position:absolute;inset:0;border-radius:27px;padding:2px;background:linear-gradient(135deg,#ff1623 0%,#ff1623 24%,#1e6fff 68%,#00a5ff 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.card:after{content:"";position:absolute;inset:-30%;background:radial-gradient(circle at 10% 50%,rgba(255,0,30,.16),transparent 28%),radial-gradient(circle at 90% 50%,rgba(0,120,255,.16),transparent 28%);pointer-events:none}
.section{position:relative;z-index:2;margin-bottom:22px}
.section-title{display:flex;align-items:center;gap:11px;font-size:18px;font-weight:1000;text-transform:uppercase;margin-bottom:10px}
.section-icon{font-size:22px}
input{width:100%;height:58px;border-radius:14px;border:2px solid transparent;background:linear-gradient(#101b27,#101b27) padding-box,linear-gradient(90deg,#ff1724,#0b8eff) border-box;color:#fff;padding:0 17px;font-size:20px;outline:0;box-shadow:inset 0 0 20px rgba(0,0,0,.35)}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.9;cursor:pointer}
.slots{display:grid;visibility:visible;opacity:1;grid-template-columns:repeat(4,1fr);gap:10px}
.slot{min-height:53px;border-radius:13px;border:2px solid #0a92ff;background:rgba(5,14,23,.84);color:#fff;font-size:16px;font-weight:900;cursor:pointer;transition:.15s;box-shadow:0 0 10px rgba(0,125,255,.10)}
.slot:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 0 18px rgba(0,140,255,.32)}
.slot.selected{background:linear-gradient(90deg,#ff1620,#e82054,#078cff);border-color:#fff;box-shadow:0 0 24px rgba(0,140,255,.4)}
.slot.busy{border-color:#ff3945;background:rgba(80,16,22,.65);color:#bfc0c5;cursor:not-allowed}
.slot.busy small{display:block;font-size:12px;margin-top:3px;color:#ddd}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px;position:relative;z-index:2}
.field label{display:block;font-size:16px;font-weight:1000;text-transform:uppercase;margin-bottom:9px}
.confirm{position:relative;z-index:2;width:100%;height:68px;border:0;border-radius:17px;margin-top:8px;background:linear-gradient(90deg,#ff111b 0%,#f21e51 45%,#078cff 100%);color:#fff;font-size:24px;font-weight:1000;cursor:pointer;box-shadow:0 10px 35px rgba(0,0,0,.4)}
.confirm:hover{filter:brightness(1.08)}
.msg{display:none;position:relative;z-index:2;margin-top:13px;padding:13px;border-radius:12px;text-align:center;font-weight:800;background:rgba(13,45,28,.92);border:1px solid #36d47b}
.footer{position:relative;z-index:2;text-align:center;color:#c8ced7;font-size:13px;margin-top:13px}
@media(max-width:700px){
 body{background-attachment:scroll}
 .page{padding:12px 10px 40px}
 .logo{height:210px;width:min(310px,82vw);margin-top:0}
 h1{font-size:clamp(39px,11vw,55px)}
 .brandline{font-size:11px;letter-spacing:5px}
 .subtitle{font-size:14px}
 .logo{height:175px;width:min(285px,78vw);margin:-2px auto -8px}
 h1{font-size:clamp(34px,10.2vw,48px);letter-spacing:-1.8px}
 .brandline{font-size:10px;letter-spacing:4px;margin:8px 0 5px}
 .subtitle{font-size:12px;line-height:1.35;margin-bottom:12px}
 .benefits{grid-template-columns:repeat(3,1fr);gap:0;margin:0 auto 15px;max-width:100%}
 .benefit{min-height:62px;padding:4px 6px;gap:5px;border-right:1px solid rgba(255,255,255,.22);border-bottom:0;font-size:10px;line-height:1.15}
 .benefit:last-child{border-right:0}
 .bicon{width:30px;height:30px;min-width:30px;font-size:15px}
 .card{padding:17px 14px;border-radius:22px}
 .card:before{border-radius:23px}
 .section-title{font-size:15px}.slots{grid-template-columns:repeat(2,1fr);gap:8px}
 .slot{min-height:50px;font-size:14px}
 .fields{grid-template-columns:1fr;gap:12px}
 .confirm{font-size:20px;height:60px}
}
</style>

  for(const m of [0,30]){
    if(h===22 && m===30) continue;
    slots.push(String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'));
  }
}
function localDate(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function fmt(t){
  return new Date('2000-01-01T'+t).toLocaleTimeString('es-DO',{hour:'numeric',minute:'2-digit'});
}
async function getBooked(date){
  const u=SUPABASE_URL+'/rest/v1/appointment_slots?select=appointment_date,appointment_time&appointment_date=eq.'+encodeURIComponent(date);
  const r=await fetch(u,{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const rows=await r.json();
  return rows.map(x=>String(x.appointment_time).slice(0,5));
}
async function render(){
  const date=document.getElementById('date').value;
  const box=document.getElementById('slots');
  selected='';
  const buttons=[...box.querySelectorAll('.slot')];

  buttons.forEach((btn,i)=>{
    const t=slots[i];
    btn.disabled=false;
    btn.classList.remove('busy','selected');
    btn.innerHTML=fmt(t);
    btn.onclick=()=>{
      buttons.forEach(x=>x.classList.remove('selected'));
      btn.classList.add('selected');
      selected=t;
    };
  });

  if(!date) return;

  try{
    const booked=await getBooked(date);
    buttons.forEach((btn,i)=>{
      const t=slots[i];
      if(booked.includes(t)){
        btn.classList.add('busy');
        btn.disabled=true;
        btn.innerHTML=`${fmt(t)}<small>Ocupado</small>`;
      }
    });
  }catch(e){
    console.warn('Disponibilidad temporalmente no consultable:',e);
    // Los horarios permanecen visibles y seleccionables.
  }
}
async function book(){
  const date=document.getElementById('date').value;
  const name=document.getElementById('name').value.trim();
  const phone=document.getElementById('phone').value.trim();
  const msg=document.getElementById('msg');
  if(!date||!selected||!name||!phone){alert('Completa el día, la hora, nombre y teléfono.');return;}

  const time=selected;
  const payload={appointment_date:date,appointment_time:time+':00',customer_name:name,phone:phone,status:'confirmed'};

  try{
    // Método principal: inserción directa en la tabla.
    // Prefer=minimal evita exigir permisos SELECT a los clientes públicos.
    let r=await fetch(SUPABASE_URL+'/rest/v1/appointments',{
      method:'POST',
      headers:{
        apikey:SUPABASE_KEY,
        Authorization:'Bearer '+SUPABASE_KEY,
        'Content-Type':'application/json',
        Prefer:'return=minimal'
      },
      body:JSON.stringify(payload)
    });

    if(r.ok){
      msg.style.display='block';
      msg.textContent='Cita confirmada: '+date+' a las '+fmt(time);
      document.getElementById('name').value='';
      document.getElementById('phone').value='';
      selected='';
      await render();
      return;
    }

    // Si la inserción directa falla, intenta la función RPC ya configurada.
    const firstError=await r.text();
    console.warn('Inserción directa:',r.status,firstError);

    r=await fetch(SUPABASE_URL+'/rest/v1/rpc/create_appointment',{
      method:'POST',
      headers:{
        apikey:SUPABASE_KEY,
        Authorization:'Bearer '+SUPABASE_KEY,
        'Content-Type':'application/json',
        Accept:'application/json'
      },
      body:JSON.stringify({p_date:date,p_time:time+':00',p_name:name,p_phone:phone})
    });

    if(r.ok){
      msg.style.display='block';
      msg.textContent='Cita confirmada: '+date+' a las '+fmt(time);
      document.getElementById('name').value='';
      document.getElementById('phone').value='';
      selected='';
      await render();
      return;
    }

    const secondError=await r.text();
    console.error('RPC:',r.status,secondError);
    if(r.status===409){
      msg.style.display='block';
      msg.textContent='Ese horario acaba de ser reservado por otra persona. Elige otro.';
      await render();
      return;
    }
    throw new Error('HTTP '+r.status+' '+secondError);
  }catch(e){
    console.error('Error al confirmar cita:',e);
    msg.style.display='block';
    msg.textContent='No se pudo confirmar la cita. Intenta nuevamente.';
    await render();
  }
}
const dateInput=document.getElementById('date');
dateInput.value=localDate();
dateInput.min=localDate();
dateInput.addEventListener('change',render);
render();
</script>
</body>
